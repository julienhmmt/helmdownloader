# SonarQube project: helmdownloader (Go module at repo root)
sonar.projectKey=helmdownloader
sonar.projectName=helmdownloader (Go)
sonar.projectVersion=0.4.0

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.language=go

sonar.exclusions=\
  **/vendor/**,\
  **/tmp/**,\
  **/*.db,\
  **/*.db-*,\
  **/graphify-out/**,\
  **/.DS_Store,\
  **/coverage.out,\
  **/archives/**

sonar.go.coverage.reportPaths=.sonar/server-coverage.out

sonar.coverage.exclusions=**/*_test.go

sonar.sourceEncoding=UTF-8
